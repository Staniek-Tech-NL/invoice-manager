<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Manager clean architecture</title>
  <desc id="desc">Application layers and implemented infrastructure ports.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#656B70"/></marker></defs>
  <rect width="1600" height="900" fill="#F4F1EA"/>
  <text x="110" y="112" fill="#202428" font-family="Segoe UI, Arial" font-size="54" font-weight="700">Business rules stay independent</text>
  <text x="112" y="162" fill="#656B70" font-family="Segoe UI, Arial" font-size="24">Clean Architecture with MVVM at the Windows desktop boundary</text>
  <g fill="none" stroke="#656B70" stroke-width="3" marker-end="url(#arrow)">
    <path d="M400 382h115"/><path d="M870 382h115"/><path d="M927 596v-41H692v-49"/>
  </g>
  <g font-family="Segoe UI, Arial">
    <rect x="110" y="258" width="290" height="248" fill="#FFFFFF" stroke="#D7D3CB" stroke-width="2"/>
    <text x="142" y="308" fill="#656B70" font-size="18" font-weight="700">01 / APP</text>
    <text x="142" y="360" fill="#202428" font-size="30" font-weight="700">WPF + MVVM</text>
    <text x="142" y="407" fill="#656B70" font-size="21">Views</text><text x="142" y="442" fill="#656B70" font-size="21">View models</text><text x="142" y="477" fill="#656B70" font-size="21">Navigation</text>
    <rect x="515" y="258" width="355" height="248" fill="#FFFFFF" stroke="#D7D3CB" stroke-width="2"/>
    <text x="547" y="308" fill="#656B70" font-size="18" font-weight="700">02 / APPLICATION</text>
    <text x="547" y="360" fill="#202428" font-size="30" font-weight="700">Use cases + ports</text>
    <text x="547" y="407" fill="#656B70" font-size="21">Commands and queries</text><text x="547" y="442" fill="#656B70" font-size="21">Orchestration</text><text x="547" y="477" fill="#656B70" font-size="21">External boundaries</text>
    <rect x="985" y="258" width="355" height="248" fill="#FFFFFF" stroke="#345995" stroke-width="4"/>
    <text x="1017" y="308" fill="#345995" font-size="18" font-weight="700">03 / DOMAIN</text>
    <text x="1017" y="360" fill="#202428" font-size="30" font-weight="700">Business rules</text>
    <text x="1017" y="407" fill="#656B70" font-size="21">Entities + snapshots</text><text x="1017" y="442" fill="#656B70" font-size="21">Financial calculations</text><text x="1017" y="477" fill="#656B70" font-size="21">Lifecycle invariants</text>
    <rect x="515" y="596" width="825" height="150" fill="#EEEAE2" stroke="#D7D3CB" stroke-width="2"/>
    <text x="547" y="642" fill="#656B70" font-size="18" font-weight="700">INFRASTRUCTURE IMPLEMENTS PORTS</text>
    <text x="547" y="697" fill="#202428" font-size="28">EF Core  ·  SQLite  ·  PDFsharp  ·  File storage  ·  Logging</text>
    <line x1="110" y1="798" x2="1490" y2="798" stroke="#D7D3CB" stroke-width="2"/>
    <text x="110" y="844" fill="#345995" font-size="23" font-weight="700">RESULT</text>
    <text x="220" y="844" fill="#202428" font-size="23">Domain and application tests run without WPF or SQLite.</text>
  </g>
</svg>
