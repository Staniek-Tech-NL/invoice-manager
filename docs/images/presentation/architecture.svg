<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Manager clean architecture</title>
  <desc id="desc">Four application layers and their dependency direction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1830"/><stop offset="1" stop-color="#142A52"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#061126" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#66D9EF"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1445" cy="90" r="230" fill="#2D6CDF" opacity=".12"/>
  <circle cx="80" cy="820" r="250" fill="#16C7D9" opacity=".06"/>
  <text x="104" y="112" fill="#FFFFFF" font-family="Segoe UI, Arial" font-size="54" font-weight="700">Clean architecture</text>
  <text x="106" y="162" fill="#AFC1DE" font-family="Segoe UI, Arial" font-size="25">Dependencies point inward; business rules remain independent.</text>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial">
    <rect x="105" y="255" width="310" height="340" rx="26" fill="#FFFFFF"/>
    <rect x="105" y="255" width="310" height="12" rx="6" fill="#2D6CDF"/>
    <text x="145" y="330" fill="#172033" font-size="32" font-weight="700">App</text>
    <text x="145" y="374" fill="#52627A" font-size="21">WPF views</text><text x="145" y="408" fill="#52627A" font-size="21">View models</text><text x="145" y="442" fill="#52627A" font-size="21">Navigation</text>
    <rect x="478" y="255" width="310" height="340" rx="26" fill="#FFFFFF"/>
    <rect x="478" y="255" width="310" height="12" rx="6" fill="#3D83F7"/>
    <text x="518" y="330" fill="#172033" font-size="32" font-weight="700">Application</text>
    <text x="518" y="374" fill="#52627A" font-size="21">Use cases</text><text x="518" y="408" fill="#52627A" font-size="21">Ports</text><text x="518" y="442" fill="#52627A" font-size="21">Orchestration</text>
    <rect x="851" y="255" width="310" height="340" rx="26" fill="#FFFFFF"/>
    <rect x="851" y="255" width="310" height="12" rx="6" fill="#66D9EF"/>
    <text x="891" y="330" fill="#172033" font-size="32" font-weight="700">Domain</text>
    <text x="891" y="374" fill="#52627A" font-size="21">Entities</text><text x="891" y="408" fill="#52627A" font-size="21">Value objects</text><text x="891" y="442" fill="#52627A" font-size="21">Business rules</text>
    <rect x="1224" y="255" width="271" height="340" rx="26" fill="#EAF1FF"/>
    <rect x="1224" y="255" width="271" height="12" rx="6" fill="#8AAEF5"/>
    <text x="1264" y="330" fill="#172033" font-size="30" font-weight="700">Infrastructure</text>
    <text x="1264" y="374" fill="#52627A" font-size="21">EF Core + SQLite</text><text x="1264" y="408" fill="#52627A" font-size="21">PDF generation</text><text x="1264" y="442" fill="#52627A" font-size="21">File storage</text>
  </g>
  <g fill="none" stroke="#66D9EF" stroke-width="5" marker-end="url(#arrow)"><path d="M425 425h36"/><path d="M798 425h36"/><path d="M1220 485h-42"/></g>
  <rect x="105" y="682" width="1390" height="102" rx="22" fill="#FFFFFF" opacity=".08" stroke="#6F93C8"/>
  <text x="145" y="726" fill="#66D9EF" font-family="Segoe UI, Arial" font-size="21" font-weight="700">DESIGN RESULT</text>
  <text x="145" y="763" fill="#E9F2FF" font-family="Segoe UI, Arial" font-size="24">Testable financial rules, replaceable infrastructure, and a focused desktop interface.</text>
</svg>
