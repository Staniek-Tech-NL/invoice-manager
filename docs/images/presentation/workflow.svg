<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Manager business workflow</title>
  <desc id="desc">The journey from company setup through payment and dashboard reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F9FD"/><stop offset="1" stop-color="#E9F0FC"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14213D" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2D6CDF"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="104" y="116" fill="#14213D" font-family="Segoe UI, Arial" font-size="54" font-weight="700">From quote to insight</text>
  <text x="106" y="166" fill="#52627A" font-family="Segoe UI, Arial" font-size="25">One auditable workflow, backed by immutable document snapshots.</text>
