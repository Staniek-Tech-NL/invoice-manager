<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Manager quotation-to-payment workflow</title>
  <desc id="desc">Five numbered stages from company profile to reporting.</desc>
  <rect width="1600" height="900" fill="#F4F1EA"/>
  <text x="110" y="112" fill="#202428" font-family="Segoe UI, Arial" font-size="54" font-weight="700">From quote to payment</text>
  <text x="112" y="162" fill="#656B70" font-family="Segoe UI, Arial" font-size="24">A focused local workflow for freelancers and small businesses</text>
  <line x1="110" y1="302" x2="1490" y2="302" stroke="#345995" stroke-width="4"/>
  <g font-family="Segoe UI, Arial">
    <g transform="translate(110 0)"><text y="274" fill="#345995" font-size="22" font-weight="700">01</text><text y="365" fill="#202428" font-size="30" font-weight="700">Company</text><text y="406" fill="#656B70" font-size="21">Single issuer profile</text><text y="438" fill="#656B70" font-size="21">and defaults</text></g>
    <g transform="translate(390 0)"><text y="274" fill="#345995" font-size="22" font-weight="700">02</text><text y="365" fill="#202428" font-size="30" font-weight="700">Quote</text><text y="406" fill="#656B70" font-size="21">Snapshots + VAT</text><text y="438" fill="#656B70" font-size="21">controlled lifecycle</text></g>
    <g transform="translate(670 0)"><text y="274" fill="#345995" font-size="22" font-weight="700">03</text><text y="365" fill="#202428" font-size="30" font-weight="700">Invoice</text><text y="406" fill="#656B70" font-size="21">Atomic numbering</text><text y="438" fill="#656B70" font-size="21">one-time conversion</text></g>
    <g transform="translate(950 0)"><text y="274" fill="#345995" font-size="22" font-weight="700">04</text><text y="365" fill="#202428" font-size="30" font-weight="700">Payment</text><text y="406" fill="#656B70" font-size="21">Partial or full</text><text y="438" fill="#656B70" font-size="21">auditable voiding</text></g>
    <g transform="translate(1230 0)"><text y="274" fill="#345995" font-size="22" font-weight="700">05</text><text y="365" fill="#202428" font-size="30" font-weight="700">Reporting</text><text y="406" fill="#656B70" font-size="21">Derived balances</text><text y="438" fill="#656B70" font-size="21">and revenue</text></g>
    <line x1="110" y1="560" x2="1490" y2="560" stroke="#D7D3CB" stroke-width="2"/>
    <text x="110" y="625" fill="#656B70" font-size="18" font-weight="700">IMPLEMENTED BOUNDARIES</text>
    <text x="110" y="681" fill="#202428" font-size="27">Local-first</text><text x="345" y="681" fill="#202428" font-size="27">EUR</text><text x="500" y="681" fill="#202428" font-size="27">SQLite</text><text x="700" y="681" fill="#202428" font-size="27">No cloud account</text><text x="1040" y="681" fill="#202428" font-size="27">Snapshot-safe PDF</text>
    <rect x="110" y="758" width="16" height="16" fill="#3F6B58"/><text x="148" y="773" fill="#656B70" font-size="20">Complete in v1.0.0</text>
  </g>
</svg>
