    <g transform="translate(185 450)"><circle r="92" fill="#14213D"/><path d="M-31-15h62v52h-62zM-18-35h36v20h-36z" fill="none" stroke="#66D9EF" stroke-width="7"/><text y="138" fill="#172033" font-size="23" font-weight="700">Company</text><text y="170" fill="#62728A" font-size="18">profile</text></g>
    <g transform="translate(420 450)"><circle r="92" fill="#FFFFFF"/><path d="M-34-40h68v80h-68zM-20-15h40M-20 2h40M-20 19h28" fill="none" stroke="#2D6CDF" stroke-width="7" stroke-linecap="round"/><text y="138" fill="#172033" font-size="23" font-weight="700">Quote</text><text y="170" fill="#62728A" font-size="18">snapshot + VAT</text></g>
    <g transform="translate(655 450)"><circle r="92" fill="#FFFFFF"/><path d="M-34-42h68v84h-68zM-20-17h40M-20 1h40M-20 19h40" fill="none" stroke="#2D6CDF" stroke-width="7" stroke-linecap="round"/><circle cx="27" cy="31" r="17" fill="#66D9EF"/><text y="138" fill="#172033" font-size="23" font-weight="700">Invoice</text><text y="170" fill="#62728A" font-size="18">safe numbering</text></g>
    <g transform="translate(890 450)"><circle r="92" fill="#FFFFFF"/><path d="M-32-42h64v84h-64zM-17-14h34M-17 3h34" fill="none" stroke="#2D6CDF" stroke-width="7"/><text x="0" y="31" fill="#2D6CDF" font-size="22" font-weight="700">PDF</text><text y="138" fill="#172033" font-size="23" font-weight="700">Document</text><text y="170" fill="#62728A" font-size="18">reproducible</text></g>
