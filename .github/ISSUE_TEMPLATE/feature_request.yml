name: Feature request
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user or engineering problem should this change solve?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Describe the required behavior without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Mention affected requirements, business rules, tests, or ADRs.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking issues or milestones, if any.

  - type: textarea
    id: documentation
    attributes:
      label: Documentation
      description: Identify documentation that should be added or updated.
