name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore InvoiceManager.sln

      - name: Build
        run: dotnet build InvoiceManager.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test InvoiceManager.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Audit direct and transitive dependencies
        run: dotnet package list --project InvoiceManager.sln --vulnerable --include-transitive --no-restore

      - name: Verify EF Core model matches migrations
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/InvoiceManager.Infrastructure/InvoiceManager.Infrastructure.csproj
          --startup-project src/InvoiceManager.Infrastructure/InvoiceManager.Infrastructure.csproj
          --configuration Release
          --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error
